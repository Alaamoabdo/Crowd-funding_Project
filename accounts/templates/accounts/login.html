{% extends 'base.html' %}
{% block title %}Login | Crowdfunding Egypt{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}
  <button type="submit">Login</button>
</form>
<p>New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
{% endblock %}
